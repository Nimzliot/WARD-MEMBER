<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the --base-href value given to `flutter build web`
       (e.g. /WARD-MEMBER/ for GitHub Pages). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Makkal Budget: residents suggest projects, vote within their ward's budget and follow the results live. SDG 11 prototype, not an official Government of Tamil Nadu service.">
  <meta name="theme-color" content="#0B5D3B">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Makkal Budget">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Makkal Budget</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Green loading screen shown until Flutter draws its first frame. */
    html, body { margin: 0; height: 100%; background: #06402A; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(135deg, #0B5D3B, #06402A);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
      transition: opacity .4s ease;
    }
    #loading::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #FF9933 0 33.3%, #fff 33.3% 66.6%, #138808 66.6%);
    }
    #loading img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 12px 32px rgba(0,0,0,.3); }
    #loading .name { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
    #loading .tag { font-size: 13px; letter-spacing: 1.4px; font-weight: 700; color: rgba(255,255,255,.72); }
    #loading .bar { width: 120px; height: 4px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #8FE3B4; border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #loading.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Makkal Budget</div>
    <div class="tag">TAMIL NADU · PARTICIPATORY BUDGETING</div>
    <div class="bar"></div>
  </div>
  <script>
    // Hide the loading screen once Flutter has rendered.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
